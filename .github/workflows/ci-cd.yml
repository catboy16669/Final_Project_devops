name: AUPP LMS – CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

# ══════════════════════════════════════════════════════════════════
  sonarqube-scan:
# ══════════════════════════════════════════════════════════════════
    name: "1 ► SonarQube — Code Quality Scan"
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🔍 SonarQube Scan"
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN:    ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=catboy16669_Final_Project_devops
            -Dsonar.organization=catboy16669

      - name: "🚦 Quality Gate Check"
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN:    ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt


# ══════════════════════════════════════════════════════════════════
  trivy-source-scan:
# ══════════════════════════════════════════════════════════════════
    name: "2 ► Trivy — Source Code Scan"
    runs-on: ubuntu-latest
    needs: sonarqube-scan

    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "🛡️ Trivy — Scan source files"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type:     "fs"
          scan-ref:      "."
          severity:      "CRITICAL"
          exit-code:     "1"
          ignore-unfixed: true
          format:        "table"
          skip-dirs:     "assets/vendor"
          output:        "trivy-source-report.txt"

      - name: "📄 Upload Trivy source report"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-source-report
          path: trivy-source-report.txt


# ══════════════════════════════════════════════════════════════════
  docker-build-scan-push:
# ══════════════════════════════════════════════════════════════════
    name: "3 ► Docker — Build, Scan & Push"
    runs-on: ubuntu-latest
    needs: trivy-source-scan

    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "🐳 Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "🔑 Login to DockerHub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "🏷️ Generate image tags"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/aupp-lms-website
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.run_number }}

      - name: "🐳 Build Docker image (local only)"
        uses: docker/build-push-action@v5
        with:
          context: .
          push:  false
          load:  true
          tags:  ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: "🛡️ Trivy — Scan Docker image"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type:      "image"
          image-ref:      "${{ secrets.DOCKERHUB_USERNAME }}/aupp-lms-website:${{ github.run_number }}"
          severity:       "CRITICAL"
          exit-code:      "1"
          ignore-unfixed: true
          format:         "table"
          output:         "trivy-image-report.txt"

      - name: "📄 Upload Trivy image report"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-report
          path: trivy-image-report.txt

      - name: "📤 Push image to DockerHub"
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max


# ══════════════════════════════════════════════════════════════════
  terraform-provision:
# ══════════════════════════════════════════════════════════════════
    name: "4 ► Terraform — Provision All Infrastructure"
    runs-on: ubuntu-latest
    needs: docker-build-scan-push
    outputs:
      app-server-ip: ${{ steps.tf-output.outputs.app_ip }}

    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "⚙️ Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
          terraform_wrapper: false

      - name: "☁️ Terraform Init"
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN:     ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION:    us-east-1
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=us-east-1"

      - name: "📋 Terraform Plan"
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN:     ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION:    us-east-1
        run: |
          terraform plan \
            -var="ec2_public_key=${{ secrets.EC2_SSH_PUBLIC_KEY }}" \
            -out=tfplan

      - name: "🚀 Terraform Apply"
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN:     ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION:    us-east-1
        run: terraform apply -auto-approve tfplan

      - name: "📡 Get Output IPs"
        id: tf-output
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN:     ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION:    us-east-1
        run: |
          APP_IP=$(terraform output -raw app_server_ip)
          echo "app_ip=${APP_IP}" >> $GITHUB_OUTPUT
          echo "✅ App server IP: ${APP_IP}"


# ══════════════════════════════════════════════════════════════════
  deploy-website:
# ══════════════════════════════════════════════════════════════════
    name: "5 ► Deploy — Website to App Server"
    runs-on: ubuntu-latest
    needs: terraform-provision

    steps:
      - name: "🚀 Deploy website + nginx-exporter via SSH"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ needs.terraform-provision.outputs.app-server-ip }}
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          timeout:  120s
          script: |
            echo "=== Connected to App Server ==="

            # Wait until Docker is fully ready (user_data may still be running)
            echo "Waiting for Docker to be ready..."
            for i in {1..15}; do
              docker info > /dev/null 2>&1 && echo "Docker ready!" && break
              echo "  Attempt $i — waiting 10s..."
              sleep 10
            done

            # Pull latest image
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/aupp-lms-website:${{ github.run_number }}

            # Stop and remove old containers
            docker stop aupp-lms      2>/dev/null || true
            docker rm   aupp-lms      2>/dev/null || true
            docker stop nginx-exporter 2>/dev/null || true
            docker rm   nginx-exporter 2>/dev/null || true

            # Run website container
            docker run -d \
              --name aupp-lms \
              --restart always \
              -p 80:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/aupp-lms-website:${{ github.run_number }}

            # Run nginx-prometheus-exporter
            docker run -d \
              --name nginx-exporter \
              --restart always \
              --network host \
              nginx/nginx-prometheus-exporter:latest \
              -nginx.scrape-uri=http://localhost:80/stub_status

            echo "=== Website deployment complete ==="
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"


# ══════════════════════════════════════════════════════════════════
  deploy-monitoring:
# ══════════════════════════════════════════════════════════════════
    name: "6 ► Deploy — Prometheus + Grafana"
    runs-on: ubuntu-latest
    needs: [terraform-provision, deploy-website]

    steps:
      - name: "📊 Deploy Prometheus + Grafana via SSH"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ needs.terraform-provision.outputs.app-server-ip }}
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          timeout:  120s
          script: |
            mkdir -p /home/ubuntu/monitoring

            # Write Prometheus config
            cat > /home/ubuntu/monitoring/prometheus.yml << 'PROMEOF'
            global:
              scrape_interval: 15s

            scrape_configs:
              - job_name: "aupp-lms-nginx"
                static_configs:
                  - targets: ["localhost:9113"]

              - job_name: "node-exporter"
                static_configs:
                  - targets: ["localhost:9100"]
            PROMEOF

            # Node Exporter (host CPU/memory/disk)
            docker stop node-exporter 2>/dev/null || true
            docker rm   node-exporter 2>/dev/null || true
            docker run -d \
              --name node-exporter \
              --restart always \
              --network host \
              -v /proc:/host/proc:ro \
              -v /sys:/host/sys:ro \
              -v /:/rootfs:ro \
              prom/node-exporter:latest \
              --path.procfs=/host/proc \
              --path.sysfs=/host/sys

            # Prometheus
            docker stop prometheus 2>/dev/null || true
            docker rm   prometheus 2>/dev/null || true
            docker run -d \
              --name prometheus \
              --restart always \
              --network host \
              -v /home/ubuntu/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml \
              prom/prometheus:latest

            # Grafana
            docker stop grafana 2>/dev/null || true
            docker rm   grafana 2>/dev/null || true
            docker run -d \
              --name grafana \
              --restart always \
              -p 3000:3000 \
              -e GF_SECURITY_ADMIN_PASSWORD=admin123 \
              grafana/grafana:latest

            echo "=== Monitoring stack ready ==="
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"


# ══════════════════════════════════════════════════════════════════
  pipeline-summary:
# ══════════════════════════════════════════════════════════════════
    name: "✅ Pipeline Complete"
    runs-on: ubuntu-latest
    needs: [terraform-provision, deploy-website, deploy-monitoring]

    steps:
      - name: "🎉 Print all service URLs"
        run: |
          APP_IP="${{ needs.terraform-provision.outputs.app-server-ip }}"
          echo ""
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║            ✅  PIPELINE SUCCEEDED                       ║"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║  🌐 Website:     http://${APP_IP}                       ║"
          echo "║  📊 Prometheus:  http://${APP_IP}:9090                  ║"
          echo "║  📈 Grafana:     http://${APP_IP}:3000                  ║"
          echo "║     Grafana login: admin / admin123                     ║"
          echo "╚══════════════════════════════════════════════════════════╝"